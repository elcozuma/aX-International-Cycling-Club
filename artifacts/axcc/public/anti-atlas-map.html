.axm-expedition{--axm-ink:#f3f3f1;--axm-muted:#bfc3c5;--axm-border:#484d50;background:#1d1f21;color:var(--axm-ink);font-family:'AX Sans','DejaVu Sans',Arial,sans-serif;font-size:14px;line-height:1.5;max-width:1560px;padding:24px;margin:0 auto;color-scheme:dark}
.axm-expedition *,.axm-expedition *::before,.axm-expedition *::after{box-sizing:border-box}
.axm-expedition p,.axm-expedition figure,.axm-expedition h3,.axm-expedition dl,.axm-expedition dd{margin:0}
.axm-expedition button,.axm-expedition input{font:inherit;color:inherit}
.axm-expedition button{cursor:pointer}
.axm-expedition button:focus-visible,.axm-expedition input:focus-visible,.axm-expedition a:focus-visible{outline:3px solid #fff;outline-offset:4px}
.axm-expedition .axm-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.axm-expedition .axm-layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:24px;align-items:start}
.axm-expedition .axm-map-column{min-width:0}
.axm-expedition .axm-map-wrap{overflow:hidden;border:1px solid var(--axm-border);border-radius:5px;background:#222527}
.axm-expedition .axm-map-svg{touch-action:auto}
.axm-expedition .axm-stage{transition:opacity .15s ease;cursor:pointer;outline:none}
.axm-expedition .axm-stage.is-muted{opacity:.18}
.axm-expedition .axm-stage.is-hot .axm-colour-line{stroke-width:5.2}
.axm-expedition .axm-map-transfer.is-hot .axm-colour-line{stroke-width:2.8;stroke:#f1f1ed}
.axm-expedition .axm-stage.is-hot .axm-stage-badge circle{fill:var(--stage-colour)}
.axm-expedition .axm-stage.is-hot .axm-stage-badge text{fill:#202224}

  root.addEventListener('keydown',event=>{if(event.key==='Escape'){event.preventDefault();reset();return;}const hit=identify(event.target);if(hit&&hit.element.tagName.toLowerCase()==='g'&&(event.key==='Enter'||event.key===' ')){event.preventDefault();locked={kind:hit.kind,id:hit.id};preview=null;update(true);}});
  root.querySelector('[data-transfers]').addEventListener('change',()=>{setTransfers();status.textContent=root.querySelector('[data-transfers]').checked?'Arrival and return transfers shown.':'Map transfers hidden. The complete dated itinerary remains available.';});
  const routeToggle=document.createElement('button');
  routeToggle.type='button';routeToggle.className='axm-route-toggle';routeToggle.textContent='Full route list';
  days.id='axm-route-list';
  routeToggle.setAttribute('aria-controls',days.id);routeToggle.setAttribute('aria-expanded','false');
  routeToggle.addEventListener('click',()=>{routeToggle.setAttribute('aria-expanded',String(routeToggle.getAttribute('aria-expanded')!=='true'));window.requestAnimationFrame(reportHeight);});
  days.before(routeToggle);
  days.innerHTML=AXMapCore.itineraryMarkup(data);root.classList.add('axm-enabled');draw();update();
  // Buttons handle map interaction. Normal page scrolling is never intercepted.
  if('ResizeObserver' in window){const observer=new ResizeObserver(()=>window.requestAnimationFrame(draw));observer.observe(map);}else window.addEventListener('resize',draw,{passive:true});
  function reportHeight(){if(window.parent!==window)window.parent.postMessage({type:'ax-anti-atlas:resize',height:Math.ceil(root.getBoundingClientRect().height)},window.location.origin);}
  if('ResizeObserver' in window){const observer=new ResizeObserver(()=>window.requestAnimationFrame(reportHeight));observer.observe(root);}reportHeight();
  function validate(next){
    if(!next||next.stages?.length!==6||next.stops?.length!==7||next.itinerary?.length!==8)throw new Error('Expected six riding stages, seven stops and D0–D7 itinerary.');
    const ids=new Set(next.stops.map(s=>s.id));
    for(const s of next.stops)if(!/^[a-z0-9-]+$/.test(s.id)||!Number.isFinite(s.latitude)||!Number.isFinite(s.longitude)||Math.abs(s.latitude)>85||Math.abs(s.longitude)>180)throw new Error('Invalid WGS84 stop.');
    for(const [i,s]of next.stages.entries())if(s.id!==`day-${i+1}`||!ids.has(s.from)||!ids.has(s.to)||!/^#[0-9a-f]{6}$/i.test(s.colour)||s.geometry?.type!=='LineString'||s.geometry.coordinates?.length<2||s.geometry.coordinates.some(q=>q.length<2||!Number.isFinite(q[0])||!Number.isFinite(q[1])||Math.abs(q[0])>180||Math.abs(q[1])>85))throw new Error('Invalid stage geometry or ID.');
    for(const [i,e]of next.itinerary.entries())if(e.id!==`day-${i}`||!/^#[0-9a-f]{6}$/i.test(e.colour))throw new Error('Invalid itinerary day or colour.');
  }
  root.antiAtlasMap={reset,getData(){return JSON.parse(JSON.stringify(data));},selectStage(id){if(!getEntry(id))throw new Error('Unknown day');locked={kind:'stage',id};preview=null;update(true);},setData(next){validate(next);data=JSON.parse(JSON.stringify(next));locked=null;preview=null;lastDetail='';days.innerHTML=AXMapCore.itineraryMarkup(data);width=0;draw();update(true);},loadTracks(collection){if(collection?.type!=='FeatureCollection')throw new Error('Expected GeoJSON FeatureCollection');const next=JSON.parse(JSON.stringify(data));for(const f of collection.features){const s=next.stages.find(s=>s.id===f.properties?.stage_id);if(!s||!f.properties?.source)throw new Error('Each track requires a known riding stage_id and source.');s.geometry=f.geometry;s.route_status='verified track';s.track_source=f.properties.source;}this.setData(next);}};
})();

</script>
